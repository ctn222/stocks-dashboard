name: Daily scrape

# ─────────────────────────────────────────────────────────────────────
#  Runs all five scrapers in the cloud on a schedule, then commits the
#  refreshed data.csv / data.js back to the repo. GitHub Pages serves the
#  updated dashboard automatically. Runs even when your Mac is off.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # TARGET TIMES: 9:45 AM ET and 4:15 PM ET, every weekday.
    #
    # Two caveats that make the cron lines look odd:
    #  1. GitHub cron is always UTC and does NOT follow daylight saving, so each
    #     target needs BOTH offsets listed to hit the same ET clock time all
    #     year (EDT = UTC-4 in summer, EST = UTC-5 in winter).
    #  2. GitHub's scheduler is best-effort. Measured on this repo, runs start
    #     43–70 min LATER than the cron time, so treat these as "no earlier
    #     than" rather than exact. Because of that, the DST twin listed second
    #     in each pair is also the safety net if the first is badly delayed.
    #
    # Each scraper keeps ONE row per date — a same-date re-run REPLACES that
    # date's rows — so the extra twin never duplicates history; it just
    # refreshes the day's snapshot, and the last run of the day wins.
    #
    # ── Mid-morning pull (target 9:45 AM ET, ~15 min after the 9:30 open) ─
    #   13:45 UTC =  9:45 AM EDT |  8:45 AM EST (pre-open; replaced by next)
    #   14:45 UTC = 10:45 AM EDT |  9:45 AM EST
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
    #
    # ── Post-close pull (target 4:15 PM ET; last run = the day's record) ──
    #   20:15 UTC =  4:15 PM EDT |  3:15 PM EST (mid-session; replaced below)
    #   21:15 UTC =  5:15 PM EDT |  4:15 PM EST
    # Both land after the 4:00 PM close in EDT; in EST the 21:15 twin is the
    # post-close one, so the final stored row is always post-close either way.
    - cron: "15 20 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch: {}        # adds a manual "Run workflow" button

permissions:
  contents: write              # lets the job push refreshed data back

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run all scrapers
        id: scrape
        run: |
          failed=""
          # Source feeds first; overallpicks LAST so it reads their fresh data.
          for proj in 52weeknewhigh barchart100 mostactive topgainers1m topoptions overallpicks; do
            echo "::group::$proj"
            if (cd "$proj" && python3 scraper.py); then
              echo "OK  $proj"
            else
              echo "FAIL $proj"
              failed="$failed $proj"
            fi
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */data.js */data.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi

      - name: Report scraper failures
        if: steps.scrape.outputs.failed != ''
        run: |
          echo "::error::Some scrapers failed:${{ steps.scrape.outputs.failed }}"
          echo "Good data from the others was still committed."
          echo "If a financial site is blocking GitHub's IP, that scraper"
          echo "may need to stay on the Mac (hybrid mode) — see DEPLOY.md."
          exit 1
