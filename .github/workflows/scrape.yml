name: Daily scrape

# ─────────────────────────────────────────────────────────────────────
#  Runs all five scrapers in the cloud on a schedule, then commits the
#  refreshed data.csv / data.js back to the repo. GitHub Pages serves the
#  updated dashboard automatically. Runs even when your Mac is off.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # TARGET TIMES: 9:45 AM and 4:15 PM Eastern, every weekday.
    #
    # These crons deliberately fire ~75 minutes EARLY. GitHub's scheduler is
    # best-effort — measured on this repo, scheduled jobs started 43-70 min
    # after their cron time, every single day. So instead of trusting cron to
    # be punctual, the job starts early and then holds itself until the exact
    # Eastern moment (see the "Wait for the target ET time" step below).
    #
    # That also removes the daylight-saving problem: the target is defined in
    # America/New_York inside the script, so these two lines never need
    # seasonal edits even though cron itself is UTC-only.
    #
    #   12:30 UTC = 8:30 AM EDT | 7:30 AM EST  -> holds until  9:45 AM ET
    #   19:00 UTC = 3:00 PM EDT | 2:00 PM EST  -> holds until  4:15 PM ET
    - cron: "30 12 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch:           # manual "Run workflow" button — scrapes immediately
    inputs:
      wait_for_target:
        description: "Hold until the next 9:45 AM / 4:15 PM ET target (tests the timing logic)"
        type: boolean
        default: false

permissions:
  contents: write              # lets the job push refreshed data back

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Max hold is 150 min (see MAX_WAIT_MIN in the wait script) plus a few
    # minutes of scraping; this ceiling just stops a runaway job.
    timeout-minutes: 200
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Scheduled runs start ~75 min early on purpose (GitHub delivers them
      # 43-70 min late). Hold here until the exact Eastern target so the data
      # is pulled at 9:45 AM / 4:15 PM ET rather than whenever cron got around
      # to it. Manual dispatches skip this and scrape right away.
      # Public repo => Actions minutes are free, so the idle wait costs nothing.
      - name: Wait for the target ET time
        if: github.event_name == 'schedule' || inputs.wait_for_target
        run: python3 .github/scripts/wait_for_et.py

      - name: Run all scrapers
        id: scrape
        run: |
          failed=""
          # Source feeds first; overallpicks LAST so it reads their fresh data.
          for proj in 52weeknewhigh barchart100 mostactive topgainers1m topoptions overallpicks; do
            echo "::group::$proj"
            if (cd "$proj" && python3 scraper.py); then
              echo "OK  $proj"
            else
              echo "FAIL $proj"
              failed="$failed $proj"
            fi
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */data.js */data.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi

      - name: Report scraper failures
        if: steps.scrape.outputs.failed != ''
        run: |
          echo "::error::Some scrapers failed:${{ steps.scrape.outputs.failed }}"
          echo "Good data from the others was still committed."
          echo "If a financial site is blocking GitHub's IP, that scraper"
          echo "may need to stay on the Mac (hybrid mode) — see DEPLOY.md."
          exit 1
