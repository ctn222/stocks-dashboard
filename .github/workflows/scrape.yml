name: Daily scrape

# ─────────────────────────────────────────────────────────────────────
#  Runs all five scrapers in the cloud on a schedule, then commits the
#  refreshed data.csv / data.js back to the repo. GitHub Pages serves the
#  updated dashboard automatically. Runs even when your Mac is off.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # GitHub cron is always UTC and does NOT follow daylight saving, so the
    # ET times below shift by an hour between EDT (summer) and EST (winter).
    # GitHub may also delay scheduled runs by 5–30 min under load.
    #
    # ── Mid-morning pull, ~15 min after the 9:30 AM ET open ──────────────
    # Both offsets are listed so a 9:45 AM ET pull happens year-round:
    #   13:45 UTC =  9:45 AM EDT (summer) |  8:45 AM EST (winter, pre-open)
    #   14:45 UTC = 10:45 AM EDT (summer) |  9:45 AM EST (winter)
    # Both fire every weekday; each scraper keeps ONE row per date, so the
    # later run simply refreshes that day's row — the stored morning snapshot
    # is always the most recent post-open pull.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
    #
    # ── Post-close pull (this one becomes the day's final record) ────────
    # 21:10 UTC = 5:10 PM EDT (summer) | 4:10 PM EST (winter) — after the
    # 4:00 PM ET close year-round.
    - cron: "10 21 * * 1-5"
  workflow_dispatch: {}        # adds a manual "Run workflow" button

permissions:
  contents: write              # lets the job push refreshed data back

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run all scrapers
        id: scrape
        run: |
          failed=""
          # Source feeds first; overallpicks LAST so it reads their fresh data.
          for proj in 52weeknewhigh barchart100 mostactive topgainers1m topoptions overallpicks; do
            echo "::group::$proj"
            if (cd "$proj" && python3 scraper.py); then
              echo "OK  $proj"
            else
              echo "FAIL $proj"
              failed="$failed $proj"
            fi
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */data.js */data.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi

      - name: Report scraper failures
        if: steps.scrape.outputs.failed != ''
        run: |
          echo "::error::Some scrapers failed:${{ steps.scrape.outputs.failed }}"
          echo "Good data from the others was still committed."
          echo "If a financial site is blocking GitHub's IP, that scraper"
          echo "may need to stay on the Mac (hybrid mode) — see DEPLOY.md."
          exit 1
